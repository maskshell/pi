name: l2-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: "Install the released patched pi, exercise the L2 agent call chain"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          npm install -g pi-namespace-patch --registry=https://registry.npmjs.org > /dev/null 2>&1
          echo "== pi: $(pi --version)"
          echo "== L2-style call (deepseek / deepseek-v4-flash / thinking high):"
          OUT="$(timeout 300 pi --mode text -p --no-session \
            --provider deepseek --model deepseek-v4-flash --thinking high \
            "Reply with exactly: L2-VERIFY-OK" 2>&1)" || true
          echo "$OUT" | tail -6
          echo "$OUT" | grep -q "L2-VERIFY-OK" && echo "RESULT: KEY VALID, CHAIN OK" || echo "RESULT: FAILED (see output above)"
