name: pat-verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: "A/B — raw PAT push (expect rejection) vs neutralized push (expect success)"
        env:
          FORK_SYNC_PAT: ${{ secrets.FORK_SYNC_PAT }}
        run: |
          set -euo pipefail
          git config user.email "verify@users.noreply.github.com"
          git config user.name "pat-verify"
          PROBE=".github/workflows/pat-verify-probe.yml"
          printf 'name: pat-verify-probe\non:\n  workflow_dispatch:\njobs:\n  p:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo ok\n' > "$PROBE"
          git add "$PROBE"
          git commit -qm "pat-verify: workflow-file probe commit"
          URL="https://x-access-token:${FORK_SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          echo "== A) raw PAT push through persisted extraheader:"
          if git push -f "$URL" "HEAD:refs/heads/pat-verify-probe" 2>/tmp/a.err; then
            echo "A: UNEXPECTED SUCCESS"
          else
            echo "A: rejected as expected:"; grep -m1 -E "refusing to allow" /tmp/a.err || true
          fi
          echo "== B) extraheader-neutralized PAT push:"
          git -c "http.https://github.com/.extraheader=" push -f "$URL" "HEAD:refs/heads/pat-verify-probe"
          echo "B: SUCCESS — fix verified in runner context"
