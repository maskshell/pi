name: publish-namespace-patch

# npm publication of a namespace release under the unscoped alias
# `pi-namespace-patch`, via npm Trusted Publishing (OIDC): no local tokens,
# no OTP. Derives the publish variant from the GitHub release asset with
# patch/ci/publish-npm.sh (namespace-patch branch) — the released artifact
# is never rebuilt. The script publishes a prerelease-form version
# (X.Y.Z-namespace.N) with sibling pins stripped; see its header for why.
#
# Trusted publisher record (npmjs.com -> package settings), required before
# the first OIDC publish:
#   repository: maskshell/pi
#   workflow:   .github/workflows/publish-namespace-patch.yml
#   environment: npm-publish
#
# Fork-specific file on main (with FORK.md and namespace-patch-tracker.yml).
#
# Trigger note: the `release: published` event has NEVER delivered here (0
# release-event runs ever; every publish so far was a manual dispatch),
# while tag pushes do deliver (upstream's Build Binaries fired on every
# namespace `v*` tag until it was disabled in the fork). The primary
# trigger is therefore the tag push; the release trigger stays as a
# belt-and-braces secondary — duplicate runs are serialized by the
# concurrency group and exit green via the script's idempotent collision
# path (auto triggers only; manual dispatch keeps the hard abort).

on:
  release:
    types: [published]
  push:
    tags: ["v*-namespace.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.85.1-namespace.1; empty = latest)"
        required: false
        default: ""
      revision:
        description: "Force npm prerelease revision (e.g. 2 -> 0.85.1-namespace.2) when a version slot is burnt"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-namespace-patch
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      # Auto runs (tag push / release event) must be idempotent: a duplicate
      # trigger that finds its slot already published exits green instead of
      # paging anyone; manual dispatches keep the hard collision abort.
      IDEMPOTENT: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
    steps:
      - name: Checkout patch scripts (namespace-patch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: namespace-patch

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC): npm is pinned to the version upstream's
      # publish job uses (npm@latest = 12.x regresses to ENEEDAUTH before
      # ever attempting the OIDC exchange), and setup-node's registry-url
      # anchors the default registry so npm's OIDC short-circuit engages.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts >/dev/null 2>&1
          echo "active npm:  $(npm --version)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "OIDC env: present"
          else
            echo "OIDC env: ABSENT — check the job's id-token: write permission"
            exit 1
          fi

      - name: Resolve release tag + download asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          fi
          case "$TAG" in
            *-namespace.*) ;;
            *) echo "refusing: ${TAG} is not a namespace release tag"; exit 1 ;;
          esac
          echo "publishing npm alias for release ${TAG}"
          # A tag-push run can start while the release's assets are still
          # uploading (release creation is tag-ref first, assets after) —
          # retry instead of racing.
          ok=0
          for i in $(seq 1 12); do
            rm -rf /tmp/pub && mkdir -p /tmp/pub
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "earendil-works-pi-coding-agent-*.tgz" --dir /tmp/pub; then ok=1; break; fi
            echo "   assets for ${TAG} not ready (attempt $i/12) — retrying in 10s"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "!! assets for ${TAG} unavailable after 2 min"; exit 1; }

      - name: Publish (trusted publishing, OIDC)
        env:
          REV: ${{ inputs.revision }}
        run: bash patch/ci/publish-npm.sh /tmp/pub/earendil-works-pi-coding-agent-*.tgz
